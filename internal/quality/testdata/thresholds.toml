# Regression guard for the label-quality scoreboard (TestScoreboardRegression).
#
# Values are the M5.2 final board (docs/QUALITY.md, "After"), per item and
# metric key (quality.Metrics; "headlines" is the headline row count). A
# higher-is-better metric must stay at or above its value minus tolerance, a
# lower-is-better one at or below its value plus tolerance, and the headline
# count at or below its value. Metrics that do not apply, and metrics at 0
# that can only rise, are left out. After a deliberate change (new
# recordings, a tuning rule), run `go run ./tools/quality` and update the
# values with the reason in docs/QUALITY.md.
#
# Re-baselined by the M5.2 review fixes: headline precision and recall
# match a row's kind as well as its lines, and unsure_labels divides by the
# labels its count can include (unsure_labels_all is the spec's
# all-labels share).

tolerance = 0.02

