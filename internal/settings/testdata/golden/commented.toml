# prt.toml — the spec's sample, with comments.

[user]
role = "backend \"core\" \\ ops"            # free text, sent to Jev with relevance questions
owns = ["api/**", "internal/{a,b}/*.go"]

[github]
repo = "acme/portal"         # default: origin remote
release_branches = ["release/*"]

[rank]
# urgency weights
w_requested = 4.0
w_breaking = 2.0
w_risk = 0.8
w_test_gap = 0.6
w_relevance = 0.5
w_release = 2.0
w_ci_red = 2.5
w_age = 0.4
w_minutes = 0.015
w_unpushed = 0.3
w_ready_stale = 0.0

[pipeline]
max_group_units = 12
embed_min_cosine = 0.7
keep_pair_p = 1.0     # keep a pair at p >= this
unsure_below = 0.55
concurrency = 6
auto_review = "needs-you+yours"

[models]
embed = "ollama:nomic-embed-code"   # or "ollama:nomic-embed-code"
jev_endpoint = "https://api.<jev-domain>/v1/systemone"
fast = "anthropic:claude-haiku-6"
deep = "anthropic:claude-opus-6"
