version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nolintlint
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    # No locale: the spec (and label ids such as "behaviour") use British
    # spelling; misspell still catches common typos.
    misspell: {}
    revive:
      rules:
        - name: blank-imports
          disabled: true # internal/deps pins modules with blank imports
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    paths:
      - testdata

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fredricw/prt
  exclusions:
    paths:
      - testdata
