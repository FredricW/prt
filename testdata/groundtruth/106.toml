[[hot_spots]]
rank = 1
path = "server/internal/users/preferences.go"
lines = [70, 89]
symbol = "putPreferences"
risk = 4
fail_mode = "security"
risk_tags = ["auth", "data write"]
certainty = "firm"
also_at = ["server/internal/users/users.go:100-103"]
reason = "any user can overwrite others' preferences"
detail = "p.UserID comes from the path and is never compared with auth.UserID(r.Context()); the middleware only checks that some session exists. Behind PORTAL_PREFERENCES_API, so live only once the switch is on, and PUT is untested."

[[hot_spots]]
rank = 2
path = "server/cmd/api/main.go"
side = "old"
lines = [25, 28]
symbol = "GET /api/v1/health"
risk = 3
fail_mode = "wrong data"
fail_mode_ok = ["wrong data", "cosmetic", "crash"]
risk_tags = ["error path"]
certainty = "firm"
reason = "removed health route still called"
detail = "health.ts ping() and StatusFooter.tsx fetch /api/v1/health; after this PR the auth middleware still lets any path ending in /health through, but the router has no such route, so the request gets 404 and every page's footer shows 'API degraded · v?'. A load balancer still probing the old path marks every instance unhealthy."

[[hot_spots]]
rank = 3
path = "server/migrations/20261010_user_preferences.sql"
lines = [14, 14]
symbol = "DROP COLUMN legacy_theme"
risk = 3
fail_mode = "wrong data"
risk_tags = ["data write"]
certainty = "firm"
reason = "one-way column drop, no rollback"
detail = "Dropping users.legacy_theme destroys its data; reverting the PR does not bring it back. Nothing in the base tree reads it, but it ships in the same migration as additive changes, so the whole migration becomes one-way."

[[hot_spots]]
rank = 4
path = "server/internal/users/users.go"
lines = [84, 86]
symbol = "Routes"
risk = 2
fail_mode = "crash"
risk_tags = []
certainty = "soft"
reason = "Routes signature changed, callers updated"
detail = "Both in-repo callers are updated and the package is internal, so only other branches break at compile time."

[[hot_spots]]
rank = 5
path = "web/src/components/SettingsForm.tsx"
lines = [16, 18]
symbol = "SettingsForm"
risk = 2
fail_mode = "crash"
fail_mode_ok = ["crash", "cosmetic"]
risk_tags = ["error path"]
certainty = "soft"
also_at = ["web/src/components/SettingsForm.tsx:27-29"]
reason = "client flag and server switch disagree"
detail = "The UI flag (user-preferences-v2) and the server switch (PORTAL_PREFERENCES_API) are independent: flag on with the switch off gives a 404 the fetch does not catch, and a failing save stops submit before 'Saved'."

[[hot_spots]]
rank = 6
path = "web/src/components/SettingsForm.tsx"
lines = [8, 8]
symbol = "SettingsForm"
risk = 2
fail_mode = "wrong data"
risk_tags = []
certainty = "soft"
also_at = ["server/internal/users/preferences.go:81-81"]
reason = "userId defaults to literal me"
detail = "App renders <SettingsForm /> without userId, so preferences go to /users/me/preferences and the server stores them under the literal id 'me', shared by every user (with the SQL table the FK to users would reject it). getCurrentUser already calls /users/me, so the server may resolve 'me' elsewhere; nothing in the diff shows it."

[[hot_spots]]
rank = 7
path = "server/cmd/api/main.go"
lines = [40, 44]
symbol = "main (ops listener)"
risk = 2
fail_mode = "crash"
risk_tags = []
certainty = "soft"
reason = "ops listener failure only logged"
detail = "If :9090 is taken the ops listener logs and exits while the API serves on, so health probes fail although the API is up; http.ListenAndServe also has no read timeouts."

